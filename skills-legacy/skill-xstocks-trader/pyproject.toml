[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "skill-xstocks-trader"
version = "0.1.0"
description = "AI-driven tokenized stocks (RWA) trading via Hyperliquid"
requires-python = ">=3.13"
dependencies = [
    "ccxt>=4.0",
    "httpx>=0.28",
    "jinja2>=3.1",
    "pandas>=2.0",
    "pandas-ta>=0.3",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "simpleeval>=1.0",
    "yfinance>=0.2",
    "web-reader",
]

[project.scripts]
xstocks-trader = "skill_xstocks_trader.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv.sources]
web-reader = { path = "../../libs/web-reader", editable = true }

[dependency-groups]
dev = [
    "pytest>=9.0.2",
]
