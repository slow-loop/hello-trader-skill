[project]
name = "skill-tw-trader"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi[standard]>=0.135.1",
    "feedparser>=6.0.12",
    "finmind>=1.9.6",
    "finnhub-python>=2.4.27",
    "fugle-marketdata>=2.4.1",
    "httpx>=0.28.1",
    "line-bot-sdk>=3.0.0",
    "matplotlib>=3.10.8",
    "mplfinance>=0.12.10b0",
    "pandas>=2.2.3",
    "pandas-ta>=0.4.71b0",
    "pyarrow>=17.0.0",
    "python-dotenv>=1.2.2",
    "pyyaml>=6.0.3",
    "simpleeval>=1.0.7",
    "web-reader",
    "yfinance>=1.2.0",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pyright]
include = ["src"]

[tool.uv.sources]
web-reader = { git = "https://github.com/w121211/hello-web-reader.git", tag = "v0.1.0" }
