[project]
name = "backend"
version = "0.1.0"
description = "TW Trader backend — FastAPI + Supabase + APScheduler"
readme = "README.md"
authors = [
    { name = "WcW", email = "1754835+w121211@users.noreply.github.com" }
]
requires-python = ">=3.13"
dependencies = [
    "aiosqlite>=0.22.1",
    "apscheduler>=3.11.0",
    "fastapi[standard]>=0.115.0",
    "feedparser>=6.0.12",
    "finmind>=1.9.6",
    "fugle-marketdata>=2.4.1",
    "httpx>=0.28.1",
    "pandas>=2.2.3",
    "pandas-ta>=0.4.71b0",
    "pyarrow>=17.0.0",
    "python-dotenv>=1.2.2",
    "pyyaml>=6.0.3",
    "simpleeval>=1.0.7",
    "supabase>=2.15.0",
    "yfinance>=1.2.0",
]

[project.scripts]
backend = "backend:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
markers = [
    "integration: marks tests as integration tests (requires internet/API access)",
]
