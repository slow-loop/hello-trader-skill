[project]
name = "backend2"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "hello-trader-skill contributors" }
]
requires-python = ">=3.13"
dependencies = [
    "market-core",
    "aiosqlite>=0.22.1",
    "apscheduler>=3.11.2",
    "fastapi[standard]>=0.135.3",
    "finmind>=1.9.6",
    "httpx>=0.28.1",
    "pyarrow>=23.0.1",
    "python-dotenv>=1.2.2",
    "pyyaml>=6.0.3",
    "supabase>=2.28.3",
]

[project.scripts]
backend2 = "backend2:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv.sources]
market-core = { path = "../libs/market-core" }

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.1.0",
]
