[project]
name = "backend2"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "WcW", email = "1754835+w121211@users.noreply.github.com" }
]
requires-python = ">=3.13"
dependencies = [
    "aiosqlite>=0.22.1",
    "apscheduler>=3.11.2",
    "fastapi[standard]>=0.135.3",
    "feedparser>=6.0.12",
    "finmind>=1.9.6",
    "fugle-marketdata>=2.4.1",
    "httpx>=0.28.1",
    "pandas>=2.3.3",
    "pandas-ta>=0.4.71b0",
    "pyarrow>=23.0.1",
    "python-dotenv>=1.2.2",
    "pyyaml>=6.0.3",
    "simpleeval>=1.0.7",
    "supabase>=2.28.3",
    "yfinance>=1.2.0",
]

[project.scripts]
backend2 = "backend2:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.1.0",
]
