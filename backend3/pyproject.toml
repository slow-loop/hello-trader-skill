[project]
name = "backend3"
version = "0.1.0"
description = "Cloud-native multi-agent trading backend (pure structured storage)"
readme = "README.md"
authors = [
    { name = "hello-trader-skill contributors" }
]
requires-python = ">=3.13"
dependencies = [
    "aiosqlite>=0.22.1",
    "fastapi[standard]>=0.135.3",
    "python-dotenv>=1.2.2",
]

[project.scripts]
backend3 = "backend3:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
