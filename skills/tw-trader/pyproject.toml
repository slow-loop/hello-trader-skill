[project]
name = "tw-trader"
version = "0.1.0"
description = "Taiwan stock trading skill"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.28.1",
    "typer>=0.15.0",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "web-reader",
    "market-core[tw]",
]

[project.scripts]
tw-trader = "tw_trader.cli:app"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv.sources]
web-reader = { git = "https://github.com/w121211/web-reader.git", tag = "v0.1.0" }
market-core = { path = "../../libs/market-core", editable = true }
