[project]
name = "tw-trader"
version = "0.1.0"
description = "Taiwan stock trading skill"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.28.1",
    "typer>=0.15.0",
    "web-reader",
]

[project.scripts]
tw-trader = "tw_trader.cli:app"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv.sources]
web-reader = { path = "../../../hello-invest/libs/web-reader", editable = true }
