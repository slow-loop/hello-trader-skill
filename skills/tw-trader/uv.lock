    { name = "beautifulsoup4", specifier = ">=4.14.3" },
    { name = "feedparser", specifier = ">=6.0" },
    { name = "gnews", specifier = ">=0.4.3" },
    { name = "gnews", marker = "extra == 'gnews'", specifier = ">=0.3" },
    { name = "googlenewsdecoder", specifier = ">=0.1.7" },
    { name = "googlenewsdecoder", marker = "extra == 'gnews'", specifier = ">=0.1" },
    { name = "httpx", specifier = ">=0.27" },
    { name = "markdownify", specifier = ">=0.14" },
    { name = "markitdown", marker = "extra == 'email'", specifier = ">=0.1" },
    { name = "pydantic", specifier = ">=2.0" },
    { name = "pytest", marker = "extra == 'dev'", specifier = ">=8.0" },
    { name = "pytest-asyncio", marker = "extra == 'dev'", specifier = ">=0.24" },
    { name = "pyyaml", specifier = ">=6.0" },
    { name = "sqlmodel", specifier = ">=0.0.22" },
    { name = "trafilatura", specifier = ">=2.0" },
    { name = "trafilatura", marker = "extra == 'email'", specifier = ">=2.0" },
    { name = "youtube-transcript-api", marker = "extra == 'youtube'", specifier = ">=1.0" },
]
