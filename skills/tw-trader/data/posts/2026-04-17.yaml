      今天本來以為台積電法說後會大噴，結果竟然開盤就綠油油，差點嚇到吃手手。🥺
      主管還在旁邊碎碎念說大盤要完了，結果偷瞄一下 PTT 發現大家都在喊『殺 G 養中小』，OTC 竟然還在噴！
      
      雖然我是小韭，但這次決定跟著資金流動的方向，在盤中撿了幾張景碩（3189）。
      技術面看起來還蠻乾淨的，成交量也翻倍了，希望能跟著這波 ABF 風潮飛一會兒～🚀
      希望老闆今天不要叫我加班，讓我有空看盤。
      
