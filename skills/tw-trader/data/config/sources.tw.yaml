# Taiwan market news sources for external web-reader CLI usage.
#
# Preferred usage (分開跑，避免每輪全掃):
#   uv run web-reader data/config/sources.tw.yaml --tags=tw,market   # 台股新聞
#   uv run web-reader data/config/sources.tw.yaml --tags=macro       # 國際總經
#   uv run web-reader data/config/sources.tw.yaml --tags=sentiment   # 本地散戶情緒（PTT）
#   uv run web-reader data/config/sources.tw.yaml --tags=research    # 半導體深度研究

sources:
  # === 台股新聞 (tags: tw, market) ===

  - name: yahoo-research
    reader: rss
    url: "https://tw.stock.yahoo.com/rss?category=research"
    tags: [tw, research]     # Yahoo 分析師觀點欄：個股 spotlight、深度分析
    cache:
      ttl: 1800

  - name: cnyes-tw-stock
    reader: cnyes
    params:
      category: tw_stock
      limit: 10              # 有個股 symbol 標記，保留但控制總量
    tags: [tw, market]
    cache:
      ttl: 900

  - name: udn-tw-market
    reader: rss
    url: "https://money.udn.com/rssfeed/news/1001/5591"
    tags: [tw, market]       # 經濟日報台股深度分析，來源與 Yahoo/Cnyes 不重疊
    cache:
      ttl: 1800

  - name: gnews-tw-macro
    reader: gnews
    params:
      query: "台股 外資 法人 買賣超"
      language: "zh-TW"
      country: "TW"
      period: "1d"
      max_results: 10        # 聚焦三大法人動向，移除台積電/半導體（已有 research 來源）
    tags: [tw, market]
    cache:
      ttl: 900

  # === 國際總經 (tags: macro) ===

  - name: yahoo-intl-markets
    reader: rss
    url: "https://tw.stock.yahoo.com/rss?category=intl-markets"
    tags: [macro]
    cache:
      ttl: 1800

  - name: cnyes-headlines
    reader: cnyes
    params:
      category: headline
      limit: 10
    tags: [macro]            # Cnyes 國際財經頭條
    cache:
      ttl: 900

  # === 本地散戶情緒 (tags: sentiment) ===

  - name: ptt-stock
    reader: ptt
    params:
      board: "Stock"
    tags: [sentiment]        # PTT/Stock 散戶即時情緒；台股最直接的散戶 pulse
    cache:
      ttl: 900

  # reddit-investing / reddit-stocks / reddit-wsb 移除：美股視角為主，對台股個股進場判斷信噪比低

  # === 半導體深度研究 (tags: research) ===

  - name: gnews-semicon
    reader: gnews
    params:
      query: "TSMC OR CoWoS OR HBM OR semiconductor supply chain"
      language: "en"
      country: "US"
      period: "3d"
      max_results: 10
    tags: [research]         # GNews 英文半導體：外資視角
    cache:
      ttl: 3600

  - name: reddit-semiconductors
    reader: reddit
    params:
      subreddit: "semiconductors"
      sort: "hot"
      limit: 10              # 工程師/業界人士視角，異質性高；limit 從 15 降至 10
    tags: [research]
    cache:
      ttl: 3600

  - name: eetimes
    reader: rss
    url: "https://eetimes.com/feed/"
    tags: [research]         # 半導體業界情報：記憶體、AI晶片、封裝技術
    cache:
      ttl: 3600
