# Lana-copycat config — copy to .env for secrets, keep this file in git

binance:
  testnet: true                     # flip to false for real trading
  futures_base_url: "https://testnet.binancefuture.com"

square:
  url: "https://www.binance.com/en/square/feed/trending"
  scrape_interval_min: 5
  max_posts: 100
  stablecoins: [USDT, USDC, BUSD, DAI, TUSD, FDUSD, USD]

signals:
  oi_window_hours: 48
  oi_min_ratio: 3.0                 # OI% change / price% change threshold
  top_gainers_n: 20

# Cattrade is an independent pipeline (not merged with Square).
# Run via `lana cattrade`; scoring logic below is self-contained.
cattrade:
  sheet_id: ""                      # set CATTRADE_SHEET_ID in .env instead — see .env.example
  fetch_timeout_sec: 15
  # v2: signals from 排行榜快照 (综合分 + 结构标签). Every symbol always has a score.
  veto:
    pumped_1d_pct: 50.0              # 1d 额变 > this AND 1w > pumped_1w_pct → veto
    pumped_1w_pct: 100.0
  filters:
    min_oi_usdt: 5_000_000           # skip illiquid
    min_freshness: 60.0              # 数据新鲜度分 threshold
  run:
    min_entry_score: 15.0            # 综合分 threshold for entry (median is ~7.5, top-40 starts ~15)
    min_conviction_healthy: 0.95     # conviction >= this → hold, don't trim
    max_close_pct_per_run: 0.10      # cap: close at most 10% per run
    min_close_pct: 0.02              # below this, skip (not worth fees)
    # time stop: close if held this long without being in profit (hours)
    time_stop_hours: 24              # 0 = disabled
    # multi-position mode (testnet forward-testing)
    multi_position: true             # true = open all qualifying candidates, not just top-1
    max_positions: 5                 # cap: never hold more than this many at once

scoring:
  weight_square: 0.4
  weight_oi: 0.35
  weight_gainers: 0.25
  top_n: 5

trader:
  max_loss_usdt: 200                # Lana's fixed-loss stop
  leverage: 10
  direction: "LONG"                 # single-direction, Lana's style
  order_type: "MARKET"
  position_size_pct: 0.05           # 5% of available balance per trade

logging:
  level: INFO
  output: logs/lana.jsonl
