# Lana-copycat config — copy to .env for secrets, keep this file in git

binance:
  testnet: true                     # flip to false for real trading
  futures_base_url: "https://testnet.binancefuture.com"

square:
  url: "https://www.binance.com/en/square/feed/trending"
  scrape_interval_min: 5
  max_posts: 100
  stablecoins: [USDT, USDC, BUSD, DAI, TUSD, FDUSD, USD]

signals:
  oi_window_hours: 48
  oi_min_ratio: 3.0                 # OI% change / price% change threshold
  top_gainers_n: 20

# Cattrade is an independent pipeline (not merged with Square).
# Run via `lana cattrade`; scoring logic below is self-contained.
cattrade:
  sheet_id: "1k16nGFCE7oBXrEqvTpHSA2Z5530GM_kou-wiWklTsfY"
  fetch_timeout_sec: 15
  scoring:
    pattern_b_base: 40
    same_up_bonus: 15
    down_penalty: 10
    short_rank_weight: 5
    mid_rank_weight: 8
    vol_z_sweet_spot: [1.5, 3.0]
    vol_z_overheated: 5.0
  veto:
    pumped_1d_rank_max: 3
    pumped_1w_rank_max: 3
    short_impact_threshold: 1.0
  filters:
    min_oi_usdt: 5_000_000

scoring:
  weight_square: 0.4
  weight_oi: 0.35
  weight_gainers: 0.25
  top_n: 5

trader:
  max_loss_usdt: 200                # Lana's fixed-loss stop
  leverage: 10
  direction: "LONG"                 # single-direction, Lana's style
  order_type: "MARKET"
  position_size_pct: 0.05           # 5% of available balance per trade

logging:
  level: INFO
  output: logs/lana.jsonl
