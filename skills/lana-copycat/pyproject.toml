[project]
name = "lana-copycat"
version = "0.1.0"
description = "Lana-style Binance Square sentiment + OI momentum trading agent"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.15.0",
    "httpx>=0.28.1",
    "playwright>=1.44.0",
    "pyyaml>=6.0",
    "python-binance>=1.0.19",
    "rich>=13.0.0",
    "python-dotenv>=1.0.0",
    "beautifulsoup4>=4.12.0",
]

[project.scripts]
lana = "lana_copycat.cli:app"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-httpx>=0.30.0",
    "responses>=0.25.0",
]
