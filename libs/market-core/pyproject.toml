[project]
name = "market-core"
version = "0.1.0"
description = "Reusable market data and technical analysis core."
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "feedparser>=6.0",
    "fugle-marketdata>=2.4.1",
    "numpy>=1.26",
    "pandas>=2.3.3",
    "pandas-ta>=0.4.71b0",
    "pydantic>=2.0",
    "python-dotenv>=1.0.0",
    "pyarrow>=14.0",
    "pyyaml>=6.0",
    "simpleeval>=1.0.7",
    "typer>=0.15.0",
    "yfinance>=1.2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
tw = ["finmind>=1.9.6"]
chart = ["mplfinance>=0.12"]
backtest = [
    "alphalens-reloaded>=0.4.5",
    "vectorbt>=0.26",
]

[project.scripts]
market = "market_core.cli:main"
factor = "market_core.factors_cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/market_core"]

[tool.pytest.ini_options]
addopts = "-m 'not live'"
markers = [
    "live: external network smoke tests",
]
