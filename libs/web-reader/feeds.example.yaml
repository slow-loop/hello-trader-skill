# Example feeds config for web-reader
# Usage:
#   uv run web-reader feeds.yaml
#   uv run web-reader feeds.yaml --tags=finance
#   uv run web-reader feeds.yaml --tags=finance,tech --format=md

sources:
  - name: hn-frontpage
    reader: rss
    url: "https://hnrss.org/frontpage"
    tags: [tech]
    cache:
      ttl: 3600

  - name: r-investing
    reader: reddit
    tags: [finance, reddit]
    params:
      subreddit: investing
      sort: hot
      limit: 10
    cache:
      ttl: 1800

  - name: r-stocks-top
    reader: reddit
    tags: [finance, reddit]
    params:
      subreddit: stocks
      sort: top
      time: week
      limit: 15
    cache:
      ttl: 3600

  - name: substack-transcript
    reader: substack
    tags: [finance]
    params:
      publication: thetranscript
      limit: 5
    cache:
      ttl: 7200

  - name: yt-gooaye
    reader: youtube_channel
    tags: [finance, kol, youtube]
    params:
      handle: "@Gooaye"
      limit: 3
    cache:
      ttl: 3600

