# web-reader feeds config
# Usage:
#   uv run web-reader feeds.yaml --tags=podcast
#   uv run web-reader feeds.yaml --tags=podcast,tw
#
# Apple Podcast sources require:
#   - Episodes downloaded locally in Apple Podcasts.app
#   - GROQ_API_KEY in .env (for Whisper transcription)

defaults:
  cache:
    ttl: 86400  # 24h — podcast transcripts don't change

sources:

  # ── 台灣財經 ──────────────────────────────────────────────

  - name: podcast-gooaye
    reader: apple_podcast
    tags: [podcast, tw, finance]
    params:
      podcast_title: "Gooaye 股癌"
      limit: 3

